name: Full History Secret Audit

# The previous job called DeontewattsV1/AGI-CP/.github/workflows/full-history-secret-audit-reusable.yml
# at 74223bfe9f44408e2db62496b48b67bf531f7d1e. That workflow exits 2 whenever any
# download fails. Run 34000930167 scanned clean (0 gitleaks findings) and still
# failed because one curl returned 404. GitHub now returns 410 for logs it has
# deleted, so that reusable workflow cannot report a complete pass from Actions.
# The local script scans every retained surface, records deleted objects, and
# still fails on secret findings or on a retained object that cannot be read.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: full-history-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: retained surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Scan history and retained external surfaces
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/full-history-secret-audit.sh

      - name: Upload redacted audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-secret-audit-${{ github.run_id }}
          path: .audit/safe/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
